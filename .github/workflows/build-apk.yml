name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Initialize and Build TWA APK
      run: |
        # Konfiguratsiya yaratamiz (avtomatik rejimda)
        bubblewrap init --manifest=https://itcoders-op1-site.onrender.com/manifest.json --directory=app-twa || true
        cd app-twa || mkdir app-twa && cd app-twa
        
        # Agar manifest fayl to'g'ridan-to'g'ri o'qimasa, CLI orqali majburiy build qilish
        # (Aks holda tayyor gradle orqali yig'iladi)
      
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: |
          **/*.apk
          app-twa/**/*.apk
          
