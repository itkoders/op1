name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Generate Android Project & APK
      run: |
        # Bubblewrap yordamida veb-saytdan Android APK manifestini yaratamiz
        bubblewrap init --manifest=https://itcoders-op1-site.onrender.com/manifest.json --directory=android-app || true
        
        # Agar manifest fayl topilmasa, to'g'ridan-to'g'ri URL orqali build qilamiz
        cd android-app || mkdir android-app && cd android-app
        # Build jarayoni uchun minimal sozlama
    - name: Build APK with Gradle (Alternative WebView)
      run: |
        echo "Building APK package..."
